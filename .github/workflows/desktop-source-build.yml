name: Desktop source verification (unsigned)
on:
  workflow_dispatch:
  push:
    paths:
      - 'software/**'
      - '.github/workflows/desktop-source-build.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'software/**'
      - '.github/workflows/desktop-source-build.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record host and reference environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet --info | Set-Content evidence/dotnet.txt
          Get-ComputerInfo -Property OsBuildNumber,WindowsProductName | ConvertTo-Json | Set-Content evidence/windows.json
          Get-FileHash "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/*.dll" | Select-Object Path,Hash | ConvertTo-Json | Set-Content evidence/framework-hashes.json
      - name: Acquire checksum-verified pinned compiler
        shell: pwsh
        run: ./software/tools/Bootstrap-OpenSource.ps1 -Destination ./ci-tools
      - name: Source and asset checks
        shell: pwsh
        run: |
          python -m pip install Pillow==13.0.0
          if ($LASTEXITCODE) { throw 'Test dependency installation failed' }
          python -m unittest discover -s software/tests -v
          if ($LASTEXITCODE) { throw 'Source checks failed' }
      - name: Build unsigned desktop sources twice
        shell: pwsh
        run: |
          ./software/Build-OpenSource.ps1 -CompilerRoot ./ci-tools/compiler -OutputDirectory ./unsigned-a
          ./software/Build-OpenSource.ps1 -CompilerRoot ./ci-tools/compiler -OutputDirectory ./unsigned-b
          $results = @(Get-ChildItem unsigned-a -Filter '*.exe' | ForEach-Object {
            $left = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $right = (Get-FileHash (Join-Path './unsigned-b' $_.Name) -Algorithm SHA256).Hash
            if ($left -ne $right) { throw "Build mismatch: $($_.Name)" }
            @{ file=$_.Name; sha256=$left; identical=$true }
          })
          $results | ConvertTo-Json | Set-Content evidence/repeat-build.json
      - name: Run model tests (no driver installed)
        shell: pwsh
        run: |
          foreach ($test in @('self','reliability','usb')) {
            $report = Join-Path (Resolve-Path evidence) "$test-test.txt"
            $process = Start-Process ./unsigned-a/MinimalJoystick.exe -ArgumentList "--$test-test `"$report`"" -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(120000)) { Stop-Process -Id $process.Id; throw "$test timed out" }
            $process.Refresh()
            if ($process.ExitCode -or !(Test-Path $report)) { throw "$test failed or was blocked" }
            if (!(Get-Content $report -Raw).StartsWith('PASS:')) { throw 'Invalid test report' }
          }
      - name: Upload unsigned review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MinimalJoystick-UNSIGNED-review
          retention-days: 14
          path: |
            unsigned-a/
            evidence/
            software/LICENSE
            software/LICENSING.md
            software/driver/LICENSE
            software/publication/THIRD-PARTY-NOTICES.md
